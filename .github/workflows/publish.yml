name: Publish to npm
run-name: ${{ inputs.fin_order_id && format('Fin npm {0}', inputs.fin_order_id) || format('npm {0}', github.ref_name) }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      expected_source:
        description: 'Optional immutable main SHA from existing owner release wrapper'
        required: false
        default: ''
        type: string
      fin_order_id:
        description: 'Executor-authorized exact Fin order; never an approval by itself'
        required: false
        default: ''
        type: string

      fin_release:
        description: 'Executor-private immutable artifact snapshot (empty for standing releases)'
        required: false
        default: ''
        type: string
      fin_execution:
        description: 'Executor-private bounded execution window (empty for standing releases)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One workflow owner per package; never cancel a publication in progress.
concurrency:
  group: npm-delimit-cli-release
  cancel-in-progress: false

env:
  # Reviewed source for this package release. Never resolve a moving branch
  # independently in validation and publication; update with the reviewed bundle.
  GATEWAY_SOURCE_SHA: 'e275e5e37b154664ea596b4b3967afba10fe4937'

jobs:
  validate:
    if: github.event.inputs.fin_order_id == '' && github.event.inputs.fin_release == '' && github.event.inputs.fin_execution == ''
    # license_core.so supports Ubuntu 22.04 (glibc 2.35). A floating runner
    # produced v4.18.7 with a GLIBC_2.38 requirement that older hosts reject.
    runs-on: ubuntu-22.04
    name: Pre-publish Validation
    # Release job: generous but finite (observed <= ~9 min).
    timeout-minutes: 30
    steps:
      - name: Verify requested standing source
        env:
          EXPECTED_SOURCE: ${{ github.event.inputs.expected_source }}
        run: |
          if [ -n "$EXPECTED_SOURCE" ]; then
            [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          fi

      - name: Checkout npm-delimit
        uses: actions/checkout@v4
        with:
          path: npm-delimit
          persist-credentials: false

      - name: Checkout delimit-gateway
        uses: actions/checkout@v4
        with:
          repository: delimit-ai/delimit-gateway
          ref: ${{ env.GATEWAY_SOURCE_SHA }}
          token: ${{ secrets.GATEWAY_TOKEN }}
          path: delimit-gateway
          persist-credentials: false

      - name: Verify frozen gateway source
        run: |
          [[ "$GATEWAY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C delimit-gateway rev-parse HEAD)" = "$GATEWAY_SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: npm-delimit
        run: npm ci

      # Guard A (fail-closed): every gateway/ai file must be classified as
      # PUBLIC (bundle-allowlist.txt) or INTERNAL (bundle-internal-exclude.txt).
      # Runs against the gateway SOURCE (authoritative), before any sync.
      - name: Classification guard (fail-closed)
        working-directory: npm-delimit
        env:
          GATEWAY_OVERRIDE: ${{ github.workspace }}/delimit-gateway
        run: bash scripts/check-bundle-classification.sh

      - name: Sync gateway
        working-directory: npm-delimit
        env:
          GATEWAY_OVERRIDE: ${{ github.workspace }}/delimit-gateway
        run: |
          # The sync script looks for /home/delimit/delimit-gateway by default.
          # In CI we override via env var or symlink.
          GATEWAY_OVERRIDE="${{ github.workspace }}/delimit-gateway" npm run sync-gateway

      # Fail-closed anti-drift: the COMMITTED bundle must already equal the
      # allowlisted gateway sync. If sync produced changes, the bundle was
      # tagged stale (this is exactly what broke v4.14.2 / v4.15.0: the publish
      # job's own sync dirtied the tree and clean-tree-guard then blocked
      # npm publish). Surface it here as a clear, early failure instead.
      - name: Assert committed bundle is in sync with gateway
        working-directory: npm-delimit
        run: |
          # Tolerated here, and ONLY here:
          #   * the transient proprietary sources (license_core.py,
          #     deliberation.py) — sync-gateway keeps them past the allowlist
          #     prune so the Nuitka steps below have something to compile, and
          #     those steps strip them again. This check runs BETWEEN sync and
          #     compile, so they are legitimately present right now.
          #   * the freshly generated .so for those modules.
          #   * checksums.sha256, a manifest OVER those .so — CI compiles fresh
          #     binaries [LED-1259] so its hashes differ from HEAD's; it is
          #     regenerated to match the actually shipped .so at pack time.
          #
          # EXACT-PATH matching, deliberately not a grep chain. The previous
          # `grep -v 'gateway/ai/license_core.py'` was a SUBSTRING match, so it
          # also silently swallowed `license_core.pyi` — a TRACKED, SHIPPED
          # file — leaving the gate blind to staleness in the very stubs whose
          # staleness shipped a broken 4.19.2 (a .pyi with no .so behind it is
          # what made delimit_scan and delimit_quickstart crash on every clean
          # install). Adding `deliberation.py` the same way would have extended
          # that blind spot to the second stub. Caught in review, not in prod.
          # --no-renames is load-bearing, not cosmetic. With rename detection
          # ON, porcelain emits "R  <orig> -> <dest>" as ONE record and awk's
          # $2 lands on the ORIG path — so a rename whose ORIGIN is an exempt
          # transient (e.g. "R gateway/ai/license_core.py -> anything") would
          # match the exemption and be silently dropped. That is a fail-OPEN in
          # the gate this filter exists to harden: exactly the "stale file
          # slips through silently" class the .pyi substring bug belonged to.
          # Disabling rename detection makes each path its own record, judged
          # on its own name. It changes nothing for ordinary in-place modifies.
          DIRTY="$(git status --porcelain --no-renames -- gateway/ | awk '
            { path = $2 }
            path == "gateway/ai/license_core.py"    { next }
            path == "gateway/ai/deliberation.py"    { next }
            path == "gateway/ai/checksums.sha256"   { next }
            path ~ /^gateway\/ai\/(license_core|deliberation)\.cpython-[^\/]*\.so$/ { next }
            { print }
          ')"
          if [ -n "$DIRTY" ]; then
            echo "::error::Committed bundle is STALE vs delimit-gateway. Run 'npm run sync-gateway', review, and COMMIT the bundle before tagging a release."
            echo "$DIRTY"
            exit 1
          fi
          echo "Committed bundle matches allowlisted gateway sync."

      - name: Set up Python (LED-1259 compile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Nuitka (LED-1259 compile)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nuitka==2.5.9'

      - name: Test license_core .so (LED-1259)
        working-directory: npm-delimit
        run: bash scripts/test-license-core-so.sh
        env:
          GATEWAY_OVERRIDE: ${{ github.workspace }}/delimit-gateway

      - name: Compile license_core to native .so (LED-1259)
        working-directory: npm-delimit
        run: bash scripts/build-license-core.sh

      # LED-5462: deliberation is classified PROPRIETARY ("ships as compiled
      # .so, not source") in bundle-classification.md, but nothing ever built
      # it — only the non-executable .pyi stub shipped, so delimit_scan,
      # delimit_quickstart and delimit_deliberation_status raised
      # ModuleNotFoundError on every clean install. Without THIS step the
      # published artifact still would not contain the engine, no matter what
      # a local `npm pack` produced.
      - name: Compile deliberation to native .so (LED-5462)
        working-directory: npm-delimit
        run: bash scripts/build-proprietary-core.sh deliberation
        env:
          GATEWAY_OVERRIDE: ${{ github.workspace }}/delimit-gateway

      - name: Assert both proprietary engines are present and source-free
        working-directory: npm-delimit
        run: |
          set -euo pipefail
          for m in license_core deliberation; do
            ls gateway/ai/$m.cpython-*-*.so >/dev/null 2>&1 \
              || { echo "::error::$m .so missing from the bundle"; exit 1; }
            if [ -f "gateway/ai/$m.py" ]; then
              echo "::error::$m.py plaintext survived into the bundle"; exit 1
            fi
          done
          echo "both proprietary engines compiled; no plaintext source"

      # Guard B (fail-closed): npm pack must ship EXACTLY bundle-allowlist.txt.
      # Runs after the .so is built so the tarball reflects the final state.
      - name: Tarball parity guard (fail-closed)
        working-directory: npm-delimit
        run: bash scripts/check-bundle-parity.sh

      - name: Run tests
        working-directory: npm-delimit
        run: npm test

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: npm-delimit
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          # server.json feeds the MCP Registry record. It carries the version
          # twice — top level and packages[0] — and both must track the tag, or
          # the published registry entry points at an npm version that does not
          # exist. Checked here so a mismatch fails BEFORE anything publishes.
          SRV_VERSION=$(node -p "require('./server.json').version")
          SRV_PKG_VERSION=$(node -p "require('./server.json').packages[0].version")
          if [ "$SRV_VERSION" != "$TAG_VERSION" ] || [ "$SRV_PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::server.json versions ($SRV_VERSION / $SRV_PKG_VERSION) do not match tag ($TAG_VERSION)"
            exit 1
          fi

      # The MCP Registry record. Static rules (100-char description cap, version
      # parity with package.json, namespace) plus the registry's own schema
      # validator, under the same pinned binary the publish job uses. v4.18.0
      # reached the registry step with a description over the cap and was
      # rejected 422 AFTER npm had published; this fails the tag first.
      - name: Guard server.json (MCP Registry record)
        working-directory: npm-delimit
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -sSL -o /tmp/mcp-publisher.tar.gz "$base/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          bash scripts/check-server-json.sh /tmp/mcp-publisher

      - name: Security check
        working-directory: npm-delimit
        run: bash scripts/security-check.sh

      - name: Audit dependencies
        working-directory: npm-delimit
        run: npm audit --audit-level=high || true

      - name: Check for secrets in package
        working-directory: npm-delimit
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack-list.txt
          # Check for actual secret files by extension or exact name.
          # Previous approach grepped for substrings like "secret" and ".key"
          # which false-positived on module names (secrets_broker.py,
          # key_resolver.py, security-check.sh).
          FAILED=0
          for pattern in '\.env$' '\.env\.' 'credentials\.json' '\.npmrc' '\.key$' '\.pem$' '\.p12$' '\.pfx$'; do
            if grep -iE "$pattern" /tmp/pack-list.txt; then
              echo "::error::Potential secret file found in package matching: $pattern"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then exit 1; fi

  build_release:
    needs: validate
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.accepted.outputs.artifact-id }}
    # Keep the actual npm artifact on the same minimum Linux ABI as validation.
    runs-on: ubuntu-22.04
    name: Build and accept immutable artifact
    timeout-minutes: 30
    steps:
      - name: Checkout npm-delimit
        uses: actions/checkout@v4
        with:
          path: npm-delimit
          persist-credentials: false

      - name: Checkout delimit-gateway
        uses: actions/checkout@v4
        with:
          repository: delimit-ai/delimit-gateway
          ref: ${{ env.GATEWAY_SOURCE_SHA }}
          token: ${{ secrets.GATEWAY_TOKEN }}
          path: delimit-gateway
          persist-credentials: false

      - name: Verify frozen gateway source
        run: |
          [[ "$GATEWAY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C delimit-gateway rev-parse HEAD)" = "$GATEWAY_SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: npm-delimit
        run: npm ci

      # Build once, accept the packed customer artifact, then publish that file.
      # Explicit prepublishOnly below retains all lifecycle gates on a clean
      # checkout. File publication cannot trigger a second native rebuild.

      - name: Set up Python (LED-1259 compile)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Nuitka (LED-1259 compile)
        # prepublishOnly runs sync-gateway then build-license-core.sh so the
        # .so is generated AFTER rsync and is the artifact npm pack picks up.
        # nuitka must be importable when prepublishOnly fires.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'nuitka==2.5.9'

      - name: Verify npm >= 11.5.1 for OIDC trusted publishing
        # The final publisher independently checks its own runtime below.
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Build and pack exact release artifact
        working-directory: npm-delimit
        env:
          GATEWAY_OVERRIDE: ${{ github.workspace }}/delimit-gateway
        run: |
          set -euo pipefail
          npm run prepublishOnly
          RELEASE_DIR="$RUNNER_TEMP/delimit-release-artifact"
          mkdir -p "$RELEASE_DIR"
          npm pack --json --pack-destination "$RELEASE_DIR" > "$RELEASE_DIR/pack.json"
          PACK_FILE=$(node -e 'const p=require(process.argv[1]); if(p.length!==1 || p[0].filename!==require("path").basename(p[0].filename)) process.exit(1); process.stdout.write(p[0].filename)' "$RELEASE_DIR/pack.json")
          echo "RELEASE_TARBALL=$RELEASE_DIR/$PACK_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_EVIDENCE=$RELEASE_DIR/acceptance" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RELEASE_DIR/npm-source-sha.txt"
          echo "$GATEWAY_SOURCE_SHA" > "$RELEASE_DIR/gateway-source-sha.txt"
          node --version > "$RELEASE_DIR/node-version.txt"
          npm --version > "$RELEASE_DIR/npm-version.txt"
          python3 --version > "$RELEASE_DIR/python-version.txt"

      - name: Accept exact packed artifact
        working-directory: npm-delimit
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          python3 scripts/accept-packed-artifact.py "$RELEASE_TARBALL" "$VERSION" "$RELEASE_EVIDENCE"

      - name: Bind immutable publication metadata
        working-directory: npm-delimit
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          cp server.json "$RUNNER_TEMP/delimit-release-artifact/server.json"
          node <<'NODE'
          const fs=require('fs'), crypto=require('crypto'), path=require('path');
          const root=process.env.RUNNER_TEMP+'/delimit-release-artifact';
          const pkg=JSON.parse(fs.readFileSync('package.json'));
          const accepted=JSON.parse(fs.readFileSync(process.env.RELEASE_EVIDENCE+'/PASS.json'));
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const metadata={format:'delimit-release-artifact/1',package:pkg.name,version:pkg.version,
            source_sha:process.env.EXPECTED_SOURCE,gateway_sha:process.env.GATEWAY_SOURCE_SHA,
            run_id:process.env.GITHUB_RUN_ID,run_attempt:process.env.GITHUB_RUN_ATTEMPT,
            tarball:path.basename(process.env.RELEASE_TARBALL),sha256:hash(process.env.RELEASE_TARBALL),
            acceptance_sha256:hash(process.env.RELEASE_EVIDENCE+'/PASS.json'),server_sha256:hash(root+'/server.json')};
          if(accepted.version!==pkg.version || accepted.sha256!==metadata.sha256) throw Error('acceptance mismatch');
          fs.writeFileSync(root+'/release.json',JSON.stringify(metadata)+'\n');
          NODE

      - name: Retain exact artifact and acceptance evidence
        id: accepted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delimit-release-artifact/
          if-no-files-found: error

  select_artifact:
    needs: [validate, build_release]
    if: always() && (needs.build_release.result == 'success' || github.event.inputs.fin_order_id != '' || github.event.inputs.fin_release != '' || github.event.inputs.fin_execution != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.select.outputs.artifact_id }}
      run_id: ${{ steps.select.outputs.run_id }}
      run_attempt: ${{ steps.select.outputs.run_attempt }}
    steps:
      - name: Select existing accepted artifact
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          FIN_ORDER: ${{ github.event.inputs.fin_order_id }}
          FIN_RELEASE: ${{ github.event.inputs.fin_release }}
          FIN_EXECUTION: ${{ github.event.inputs.fin_execution }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          EXPECTED_SOURCE: ${{ github.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          LOCAL_ARTIFACT: ${{ needs.build_release.outputs.artifact_id }}
        run: |
          python3 - <<'PYSELECT'
          import hashlib,json,os,re,urllib.request
          from datetime import datetime,timezone
          def require(ok,reason):
              if not ok:raise RuntimeError(reason)
          def decode(raw):
              def pairs(items):
                  out={}
                  for key,value in items:
                      require(key not in out,'duplicate key');out[key]=value
                  return out
              return json.loads(raw,object_pairs_hook=pairs)
          def api(path):
              require(path.startswith('/repos/delimit-ai/delimit-mcp-server/'),'fixed repository')
              request=urllib.request.Request('https://api.github.com'+path,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              with opener.open(request,timeout=20) as response:
                  require(response.status==200,'GitHub read');raw=response.read(1048577)
              require(len(raw)<=1048576,'GitHub bound');return decode(raw)
          def select(value,execution,order,*,source,repository_id,read,now):
              keys={'format','package','repo','repository_id','workflow_id','main_sha','gateway_sha',
                  'build_run_id','build_run_attempt','artifact_id','artifact_zip_sha256','artifact_expires_at',
                  'acceptance_sha256','server_sha256','channel','previous','next','next_routine_at'}
              require(isinstance(value,dict) and set(value)==keys and value['format']=='shipping-npm-artifact/1'
                  and value['package']=='delimit-cli' and value['repo']=='delimit-ai/delimit-mcp-server'
                  and value['channel']=='latest' and value['main_sha']==source
                  and re.fullmatch(r'[0-9a-f]{40}',source),'Fin artifact schema/source')
              require(re.fullmatch(r'wo_[A-Za-z0-9_-]{1,128}',order),'Fin order')
              require(isinstance(execution,dict) and set(execution)=={'format','order_id','binding','envelope_sha256','requested_at','expires_at','trigger','policy'}
                  and execution['format']=='shipping-npm-execution/1' and execution['order_id']==order
                  and execution['trigger']=='owner_request'
                  and execution['binding']=={'object_sha256':hashlib.sha256(json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()}
                  and isinstance(execution['envelope_sha256'],str) and re.fullmatch(r'[0-9a-f]{64}',execution['envelope_sha256']),'Fin execution schema')
              require(type(execution['requested_at']) is int and type(execution['expires_at']) is int
                  and execution['requested_at']<=now.timestamp()<execution['expires_at']
                  and 0<execution['expires_at']-execution['requested_at']<=300,'Fin execution expired')
              for key in ('repository_id','workflow_id','build_run_id','build_run_attempt','artifact_id'):
                  require(type(value[key]) is int and value[key]>0,'Fin numeric identity')
              require(value['repository_id']==repository_id,'Fin repository')
              run=read('/repos/delimit-ai/delimit-mcp-server/actions/runs/'+str(value['build_run_id']))
              require(run.get('id')==value['build_run_id'] and run.get('run_attempt')==value['build_run_attempt']
                  and run.get('workflow_id')==value['workflow_id'] and run.get('path')=='.github/workflows/publish.yml'
                  and run.get('head_sha')==source and run.get('head_branch')=='main'
                  and run.get('event')=='workflow_dispatch' and run.get('status')=='completed'
                  and run.get('conclusion')=='success' and run.get('repository',{}).get('id')==repository_id,
                  'Fin successful existing build')
              row=read('/repos/delimit-ai/delimit-mcp-server/actions/artifacts/'+str(value['artifact_id']))
              provenance=row.get('workflow_run',{})
              require(row.get('id')==value['artifact_id'] and row.get('expired') is False
                  and row.get('name')=='npm-release-'+source+'-'+str(value['build_run_attempt'])
                  and row.get('digest')=='sha256:'+value['artifact_zip_sha256']
                  and row.get('expires_at')==value['artifact_expires_at']
                  and provenance.get('id')==value['build_run_id'] and provenance.get('head_sha')==source
                  and provenance.get('head_branch')=='main' and provenance.get('repository_id')==repository_id
                  and provenance.get('head_repository_id')==repository_id,'Fin immutable artifact')
              expiry=datetime.fromisoformat(value['artifact_expires_at'].replace('Z','+00:00'))
              require(expiry.tzinfo and now<expiry,'Fin artifact expired')
              return value['artifact_id'],value['build_run_id'],value['build_run_attempt']
          def trusted_event(event,order,raw,execution,*,actor_id,repository_id):
              require(str(actor_id)=='266558014' and event.get('sender',{}).get('id')==266558014
                  and event.get('sender',{}).get('login')=='infracore'
                  and event.get('repository',{}).get('id')==repository_id
                  and event.get('inputs')=={'dry_run':'false','expected_source':'','fin_order_id':order,'fin_release':raw,'fin_execution':execution},
                  'authenticated Fin dispatch event')
          if __name__=='__main__':
              order=os.environ.get('FIN_ORDER','');raw=os.environ.get('FIN_RELEASE','');execution=os.environ.get('FIN_EXECUTION','')
              if order or raw or execution:
                  event=decode(open(os.environ['GITHUB_EVENT_PATH']).read())
                  trusted_event(event,order,raw,execution,actor_id=os.environ['GITHUB_ACTOR_ID'],repository_id=int(os.environ['EXPECTED_REPOSITORY_ID']))
                  require(os.environ['GITHUB_ACTOR']=='infracore' and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch' and os.environ['GITHUB_REF']=='refs/heads/main'
                      and os.environ['DRY_RUN']=='false' and order and raw and execution,'complete Fin dispatch required')
                  ids=select(decode(raw),decode(execution),order,source=os.environ['EXPECTED_SOURCE'],
                      repository_id=int(os.environ['EXPECTED_REPOSITORY_ID']),read=api,now=datetime.now(timezone.utc))
              else:
                  ids=(os.environ['LOCAL_ARTIFACT'],os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'])
                  require(all(re.fullmatch(r'[1-9][0-9]*',str(v)) for v in ids),'local artifact identity')
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  for key,value in zip(('artifact_id','run_id','run_attempt'),ids):out.write(key+'='+str(value)+'\n')
          PYSELECT

  publish:
    needs: select_artifact
    runs-on: ubuntu-22.04
    name: Publish accepted bytes
    timeout-minutes: 15
    # No package checkout, dependency installation, build, or package code
    # executes in this job. Only this publisher can request an npm OIDC token.
    permissions:
      contents: read
      actions: read
      checks: write
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify publisher npm runtime
        run: |
          node --version
          npm --version
          node -e 'const p=require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(!(p[0]>11 || (p[0]===11 && (p[1]>5 || (p[1]===5 && p[2]>=1))))) process.exit(1)'

      - name: Download exact accepted artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.select_artifact.outputs.artifact_id }}
          run-id: ${{ needs.select_artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/delimit-release-artifact
          merge-multiple: true

      - name: Verify immutable publication inputs
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RUN_ID: ${{ needs.select_artifact.outputs.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.select_artifact.outputs.run_attempt }}
          FIN_RELEASE: ${{ github.event.inputs.fin_release }}
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          import base64,hashlib,json,os,re,stat,tarfile
          from pathlib import Path
          def require(ok,reason):
              if not ok: raise RuntimeError(reason)
          def read(path,maximum):
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW)
              try:
                  st=os.fstat(fd)
                  require(stat.S_ISREG(st.st_mode) and st.st_nlink==1 and 0<st.st_size<=maximum,'unsafe artifact file')
                  raw=b''
                  while len(raw)<=maximum:
                      part=os.read(fd,min(65536,maximum+1-len(raw)))
                      if not part: break
                      raw+=part
                  require(len(raw)<=maximum,'artifact too large')
                  return raw
              finally: os.close(fd)
          def verify(root,source,repository,run_id,attempt,gateway):
              require(repository=='delimit-ai/delimit-mcp-server','publication repository')
              meta=json.loads(read(root/'release.json',16384))
              require(set(meta)=={'format','package','version','source_sha','gateway_sha','run_id','run_attempt',
                  'tarball','sha256','acceptance_sha256','server_sha256'},'metadata schema')
              require(meta['format']=='delimit-release-artifact/1' and meta['package']=='delimit-cli'
                  and meta['source_sha']==source and meta['gateway_sha']==gateway
                  and meta['run_id']==run_id and meta['run_attempt']==attempt,'source/run binding')
              require(re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',meta['version'])
                  and meta['tarball']=='delimit-cli-'+meta['version']+'.tgz','package version/path')
              raw=read(root/meta['tarball'],67108864)
              accepted_raw=read(root/'acceptance/PASS.json',16384)
              server_raw=read(root/'server.json',65536)
              require(hashlib.sha256(raw).hexdigest()==meta['sha256']
                  and hashlib.sha256(accepted_raw).hexdigest()==meta['acceptance_sha256']
                  and hashlib.sha256(server_raw).hexdigest()==meta['server_sha256'],'artifact bytes changed')
              accepted=json.loads(accepted_raw)
              digest={'sha256':hashlib.sha256(raw).hexdigest(),'sha1':hashlib.sha1(raw).hexdigest(),
                  'integrity':'sha512-'+base64.b64encode(hashlib.sha512(raw).digest()).decode(),'size':len(raw)}
              require(accepted['version']==meta['version'] and all(accepted.get(k)==v for k,v in digest.items()),'acceptance binding')
              # Parse only package metadata; never extract or execute package code.
              import io
              with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive:
                  entries=[];count=0;expanded=0
                  for member in archive:
                      count+=1;expanded+=member.size
                      require(count<=10000 and expanded<=536870912,'package archive bounds')
                      if member.name=='package/package.json': entries.append(member)
                  require(len(entries)==1 and entries[0].isfile() and 0<entries[0].size<=262144,'package metadata')
                  package=json.load(archive.extractfile(entries[0]))
              require(package.get('name')=='delimit-cli' and package.get('version')==meta['version']
                  and package.get('publishConfig',{})=={},'package publication config')
              repo=package.get('repository',{});url=repo.get('url') if isinstance(repo,dict) else repo
              require(url in ('git+https://github.com/delimit-ai/delimit-mcp-server.git',
                  'https://github.com/delimit-ai/delimit-mcp-server.git'),'package repository identity')
              server=json.loads(server_raw)
              require(server.get('version')==meta['version'] and server.get('name')=='io.github.delimit-ai/delimit-mcp-server'
                  and len(server.get('packages',[]))==1 and server['packages'][0].get('identifier')=='delimit-cli'
                  and server['packages'][0].get('version')==meta['version'],'registry record binding')
              return meta,accepted,server_raw
          if __name__=='__main__':
              root=Path(os.environ['RUNNER_TEMP'])/'delimit-release-artifact'
              meta,accepted,server=verify(root,os.environ['EXPECTED_SOURCE'],os.environ['EXPECTED_REPOSITORY'],
                  os.environ['EXPECTED_RUN_ID'],os.environ['EXPECTED_RUN_ATTEMPT'],os.environ['GATEWAY_SOURCE_SHA'])
              if os.environ.get('FIN_RELEASE'):
                  bound=json.loads(os.environ['FIN_RELEASE'])
                  require(bound['main_sha']==meta['source_sha'] and bound['gateway_sha']==meta['gateway_sha']
                      and bound['acceptance_sha256']==meta['acceptance_sha256'] and bound['server_sha256']==meta['server_sha256']
                      and bound['next']['version']==meta['version']
                      and all(bound['next'][k]==accepted[k] for k in ('sha256','sha1','integrity','size')),'Fin exact accepted bytes')
              publish=Path(os.environ['RUNNER_TEMP'])/'delimit-publish';publish.mkdir(mode=0o700)
              # Keep npm's cwd separate from every downloaded package-controlled file.
              (publish/'server.json').write_bytes(server)
              (publish/'accepted.json').write_text(json.dumps(accepted))
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('RELEASE_TARBALL='+str(root/meta['tarball'])+'\n')
                  out.write('RELEASE_VERSION='+meta['version']+'\n')
          PYVERIFY

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        working-directory: ${{ runner.temp }}/delimit-publish
        run: |
          set -euo pipefail
          npm publish "$RELEASE_TARBALL" --ignore-scripts --registry=https://registry.npmjs.org --tag latest --dry-run

      - name: Enforce publication window and one-use Fin claim
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          FIN_ORDER: ${{ github.event.inputs.fin_order_id }}
          FIN_RELEASE: ${{ github.event.inputs.fin_release }}
          FIN_EXECUTION: ${{ github.event.inputs.fin_execution }}
        run: |
          python3 - <<'PYGATE'
          import base64,hashlib,json,os,re,urllib.parse,urllib.request
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          def require(ok,reason):
              if not ok:raise RuntimeError(reason)
          def stamp(value):
              parsed=datetime.fromisoformat(value.replace('Z','+00:00'));require(parsed.tzinfo is not None,'timestamp zone');return parsed
          def canonical(value):return json.dumps(value,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
          def request(url,*,data=None):
              headers={'Accept':'application/json','Accept-Encoding':'identity'}
              if url.startswith('https://api.github.com/repos/delimit-ai/delimit-mcp-server/'):
                  headers.update(Authorization='Bearer '+os.environ['GH_TOKEN'])
                  headers['X-GitHub-Api-Version']='2022-11-28'
              else:require(url=='https://registry.npmjs.org/delimit-cli','fixed endpoint')
              body=canonical(data) if data is not None else None
              if body is not None:headers['Content-Type']='application/json'
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
              with opener.open(urllib.request.Request(url,headers=headers,data=body),timeout=20) as reply:
                  require(reply.status==(201 if data is not None else 200),'HTTP failure');raw=reply.read(8388609)
              require(len(raw)<=8388608,'HTTP bound');return json.loads(raw)
          def gate(registry,accepted,version,*,bound,execution,order,now):
              def version_tuple(value):
                  require(isinstance(value,str) and re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',value),'stable compatible version')
                  return tuple(int(part) for part in value.split('.'))
              require(registry.get('name')=='delimit-cli' and isinstance(registry.get('versions'),dict)
                  and isinstance(registry.get('dist-tags'),dict) and isinstance(registry.get('time'),dict),'registry unavailable')
              previous=registry['dist-tags'].get('latest');old=version_tuple(previous);new=version_tuple(version)
              require(old<new and old[0]==new[0] and version not in registry['versions'],'routine version requires founder review')
              published=[stamp(v) for k,v in registry['time'].items() if k not in ('created','modified')]
              require(published and max(published)<=now and max(published)+timedelta(hours=24)<=now,'routine rolling 24h limit')
              if bound is not None:
                  require(execution['order_id']==order and execution['trigger']=='owner_request'
                      and execution['binding']=={'object_sha256':hashlib.sha256(canonical(bound)).hexdigest()}
                      and execution['requested_at']<=now.timestamp()<execution['expires_at']
                      and 0<execution['expires_at']-execution['requested_at']<=300,'Fin capability expired or rebound')
                  policy=execution['policy'];local=now.astimezone(ZoneInfo(policy['timezone']))
                  window=policy['restricted_window']
                  def minute(value):
                      require(isinstance(value,str) and re.fullmatch(r'[0-9]{2}:[0-9]{2}',value),'availability window')
                      hour,minute=map(int,value.split(':'));require(0<=hour<24 and 0<=minute<60,'availability window');return hour*60+minute
                  start,end=minute(window['start']),minute(window['end'])
                  require(start<end,'availability window')
                  require(not (local.weekday()<5 and start<=local.hour*60+local.minute<end),'Fin visible-action window')
                  dist=registry['versions'][previous]['dist']
                  require(bound['previous']['version']==previous and bound['previous']['shasum']==dist['shasum']
                      and bound['previous']['integrity']==dist['integrity'] and bound['next']['version']==version
                      and all(bound['next'][k]==accepted[k] for k in ('sha256','sha1','integrity','size')),'Fin channel changed')
              return previous
          def claim_order(bound,execution,order,*,run_id,attempt,actor_id,read,now):
              require(actor_id==266558014 and attempt==1 and type(run_id) is int and run_id>0,'Fin issuer/retry')
              require(execution['order_id']==order and execution['binding']=={'object_sha256':hashlib.sha256(canonical(bound)).hexdigest()}
                  and execution['requested_at']<=now.timestamp()<execution['expires_at']
                  and 0<execution['expires_at']-execution['requested_at']<=300,'Fin capability expired or rebound')
              name='Fin npm '+order;root='https://api.github.com/repos/delimit-ai/delimit-mcp-server'
              rows=read(root+'/commits/'+bound['main_sha']+'/check-runs?'+urllib.parse.urlencode({'check_name':name,'filter':'all','per_page':100}))
              require(rows.get('total_count')==0 and rows.get('check_runs')==[],'Fin order already claimed')
              claim={'format':'shipping-npm-claim/1','order_id':order,'binding':execution['binding'],
                  'envelope_sha256':execution['envelope_sha256'],'expires_at':execution['expires_at'],
                  'workflow_run_id':run_id,'workflow_run_attempt':1,'main_sha':bound['main_sha'],'artifact_id':bound['artifact_id']}
              result=read(root+'/check-runs',data={'name':name,'head_sha':bound['main_sha'],
                  'status':'in_progress','external_id':execution['binding']['object_sha256'],
                  'details_url':'https://github.com/delimit-ai/delimit-mcp-server/actions/runs/'+str(run_id),
                  'output':{'title':'Fin package publication claimed','summary':canonical(claim).decode()}})
              require(type(result.get('id')) is int and result['id']>0,'Fin claim unavailable')
              return {'id':result['id'],'claim':claim}
          if __name__=='__main__':
              accepted=json.loads((Path(os.environ['RUNNER_TEMP'])/'delimit-publish/accepted.json').read_text())
              bound=json.loads(os.environ['FIN_RELEASE']) if os.environ.get('FIN_RELEASE') else None
              execution=json.loads(os.environ['FIN_EXECUTION']) if os.environ.get('FIN_EXECUTION') else None
              order=os.environ.get('FIN_ORDER','');version=os.environ['RELEASE_VERSION']
              registry=request('https://registry.npmjs.org/delimit-cli');now=datetime.now(timezone.utc)
              gate(registry,accepted,version,bound=bound,execution=execution,order=order,now=now)
              if bound is not None:
                  require(os.environ['GITHUB_ACTOR']=='infracore' and os.environ['GITHUB_ACTOR_ID']=='266558014'
                      and os.environ['GITHUB_TRIGGERING_ACTOR']=='infracore' and os.environ['GITHUB_RUN_ATTEMPT']=='1','Fin issuer/retry')
                  claimed=claim_order(bound,execution,order,run_id=int(os.environ['GITHUB_RUN_ID']),attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),actor_id=int(os.environ['GITHUB_ACTOR_ID']),read=request,now=datetime.now(timezone.utc))
                  (Path(os.environ['RUNNER_TEMP'])/'delimit-publish/fin-claim.json').write_text(json.dumps(claimed))
              # Re-read after the durable claim, immediately before npm. A
              # capability cannot be renewed if the registry/window changed.
              registry=request('https://registry.npmjs.org/delimit-cli')
              gate(registry,accepted,version,bound=bound,execution=execution,order=order,now=datetime.now(timezone.utc))
          PYGATE

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        working-directory: ${{ runner.temp }}/delimit-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npm publish "$RELEASE_TARBALL" --ignore-scripts --registry=https://registry.npmjs.org --tag latest --access public

      - name: Verify published version
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        working-directory: ${{ runner.temp }}/delimit-publish
        run: |
          set -euo pipefail
          PKG_VERSION="$RELEASE_VERSION"
          # Registry propagation can take 30-90s after publish. Retry with
          # bounded backoff instead of racing a fixed 10s sleep (v4.3.4 hit
          # E404 on the 10s path even though the publish had succeeded).
          for attempt in 1 2 3 4 5 6; do
            if npm view "delimit-cli@$PKG_VERSION" dist --json > "$RUNNER_TEMP/published-dist.json"; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1])); const a=JSON.parse(fs.readFileSync(process.argv[2])); if(d.shasum!==a.sha1 || d.integrity!==a.integrity) throw Error("Published artifact differs from accepted tarball")' "$RUNNER_TEMP/published-dist.json" "$RUNNER_TEMP/delimit-publish/accepted.json"
              test "$(npm view delimit-cli dist-tags.latest)" = "$PKG_VERSION"
              echo "accepted bytes and latest verified on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt: not visible yet, sleeping $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::delimit-cli@$PKG_VERSION not visible in registry after 6 attempts (~5min)"
          exit 1

      - name: Complete verified Fin publication receipt
        if: github.event.inputs.fin_order_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYRECEIPT'
          import json,os,urllib.request
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'delimit-publish'
          saved=json.loads((root/'fin-claim.json').read_text());claim=saved['claim']
          receipt=dict(claim,format='shipping-npm-publication/1',publication_verified=True,
              published=json.loads((root/'accepted.json').read_text()))
          raw=json.dumps({'status':'completed','conclusion':'success','output':{
              'title':'Exact Fin package and latest verified','summary':json.dumps(receipt,sort_keys=True,separators=(',',':'))}}).encode()
          request=urllib.request.Request('https://api.github.com/repos/delimit-ai/delimit-mcp-server/check-runs/'+str(saved['id']),
              data=raw,method='PATCH',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          with opener.open(request,timeout=20) as response:
              if response.status!=200:raise RuntimeError('Fin receipt unavailable')
          PYRECEIPT

      # Publish the MCP Registry record. Without this the registry entry only
      # ever changes when someone runs mcp-publisher by hand: the record sat at
      # v4.1.38 from 2026-04 while npm reached 4.17.0, so registry consumers saw
      # a stale description for ~5 months. Runs only on a tag, only after npm
      # has been verified, and uses the existing id-token permission (no new
      # secret). Non-blocking: a registry outage must not fail a good npm
      # release, so this reports and continues.
      - name: Publish to MCP Registry
        id: mcp_registry
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        working-directory: ${{ runner.temp }}/delimit-publish
        env:
          # Pinned + checksum-verified (PR #190 review): this step runs with
          # the job's OIDC token in scope, so an unpinned "latest" binary was
          # an unacceptable supply-chain surface. Bump BOTH values together;
          # the checksum comes from registry_<ver>_checksums.txt (sigstore-signed).
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -sSL -o mcp-publisher.tar.gz "$base/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher validate server.json
          ./mcp-publisher publish server.json
          echo "published $(node -p "require('./server.json').name")@$(node -p "require('./server.json').version") to the MCP Registry"

      # continue-on-error above keeps a registry outage from failing a good
      # npm release, but a swallowed failure is exactly how the record went
      # stale for five months. Make it loud: a workflow warning AND a job
      # summary line, so drift can never silently resume.
      - name: Registry publish failed (visible)
        if: startsWith(github.ref, 'refs/tags/v') && steps.mcp_registry.outcome == 'failure'
        run: |
          echo "::warning title=MCP Registry publish FAILED::The npm release succeeded but the MCP Registry record was NOT updated for ${{ github.ref_name }}. Run mcp-publisher publish manually. See job log."
          {
            echo "## :warning: MCP Registry publish FAILED"
            echo ""
            echo "npm published **${{ github.ref_name }}** but the registry record was not updated. The record will show a stale version until published manually."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: GitHub Release
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
