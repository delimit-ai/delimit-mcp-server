name: API Governance

on:
  pull_request:
    # ready_for_review: drafts skip the job (below); marking ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    # Cost control (2026-09-21): narrowed from every *.yaml/*.yml/*.json and
    # lib/** to the inputs this job actually reads: the OpenAPI/Swagger specs
    # the spec-check step discovers, the policy files the engine auto-discovers
    # (.delimit/policies.yml, .delimit/policy.yaml, delimit.yml), and this
    # workflow. Not a required status check (no required-checks rule on main),
    # so an `on.paths` skip cannot leave a merge blocked.
    paths:
      - '**/openapi*.yaml'
      - '**/openapi*.yml'
      - '**/openapi*.json'
      - '**/swagger*.yaml'
      - '**/swagger*.yml'
      - '**/swagger*.json'
      - '.delimit/**'
      - 'delimit.yml'
      - '.github/workflows/api-governance.yml'

# Cost control: a new push to the same PR cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    name: Delimit API Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check for spec changes
        id: spec-check
        run: |
          # Find any OpenAPI/Swagger specs in the repo
          SPECS=$(find . -path ./base -prune -o \( -name "openapi*.yaml" -o -name "openapi*.yml" -o -name "openapi*.json" -o -name "swagger*.yaml" -o -name "swagger*.json" \) -print | head -1)
          if [ -n "$SPECS" ]; then
            echo "spec_found=true" >> $GITHUB_OUTPUT
            echo "spec_path=$SPECS" >> $GITHUB_OUTPUT
          else
            echo "spec_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Delimit
        if: steps.spec-check.outputs.spec_found == 'true'
        uses: delimit-ai/delimit-action@v1
        with:
          old_spec: base/${{ steps.spec-check.outputs.spec_path }}
          new_spec: ${{ steps.spec-check.outputs.spec_path }}
          mode: advisory
          # Keyless signing needs `id-token: write`, which this workflow does
          # not grant; without it cosign fell back to an interactive
          # device-code prompt and idled 300 s before failing (every run
          # ~5 min, zero signed attestations produced). Disabled explicitly
          # until the workflow is deliberately granted id-token: write.
          attestation: 'false'
