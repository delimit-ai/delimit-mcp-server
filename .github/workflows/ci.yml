name: Tests

# Cost control (2026-09-21): push runs are limited to main (and v* tags are
# already validated by publish.yml); feature branches are tested through their
# pull_request run, so a branch push no longer runs the suite twice. Drafts
# skip; ready_for_review runs the full suite on the final head.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Superseded PR runs are cancelled; pushes to main are never cancelled.
concurrency:
  # PR runs group per PR number and cancel superseded runs. Push/dispatch runs
  # get a unique group (run_id), so a main push is never cancelled or
  # displaced while queued, exactly as before.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoped-mcp:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Scoped MCP synthetic protocol tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'mcp==1.28.1' 'pytest==9.0.3'
      - run: python -m unittest discover -s tests -p test_muse_mcp.py -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m pytest -q tests/test_legacy_nested_soul_recovery.py tests/test_public_handoff_fallback.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: gateway

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ['18', '20', '22']

    name: Test Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      - run: npm test

  # Claude plugin release lane (docs/claude-plugin-release.md): a change under
  # claude-plugin/ or .claude-plugin/ must bump plugin.json, carry a provenance
  # row and pin a delimit-cli version that exists on npm. Pull requests only;
  # node builtins plus the npm CLI that setup-node provides, no npm install.
  claude-plugin-release-guard:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Claude plugin release guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Plugin version, provenance and pin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/claude-plugin-release-guard.js --base "$BASE_SHA"

  bundle-guards:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Bundle fail-closed guards
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      # Guard A — every committed gateway/ai file is classified (allow/exclude).
      # No gateway source in this job, so it runs in committed-bundle mode.
      - name: Classification guard (fail-closed)
        run: bash scripts/check-bundle-classification.sh

      # Guard B — npm pack ships EXACTLY the allowlist, nothing else.
      - name: Tarball parity guard (fail-closed)
        run: bash scripts/check-bundle-parity.sh
